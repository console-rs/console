name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      # Matches Tier 1 job targets
      TARGETS: |
        aarch64-unknown-linux-gnu
        i686-unknown-linux-gnu
        x86_64-unknown-linux-gnu
        i686-pc-windows-gnu
        i686-pc-windows-msvc
        x86_64-pc-windows-gnu
        x86_64-pc-windows-msvc
        x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.11
        with:
          tool: |
            cargo-hack
            cargo-minimal-versions
          fallback: none
      - name: Check
        run: |
          cargo minimal-versions check \
            --workspace \
            --feature-powerset \
            --ignore-private \
            --rust-version \
            $(printf '%s\n' "$TARGETS" | xargs -n1 printf -- '--target %s ')

  test:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            rust: stable
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: 1.71.0
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            rust: 1.71.0
          - os: windows-latest
            target: i686-pc-windows-msvc
            rust: 1.71.0
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: 1.71.0
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: stable
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: beta
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          override: true
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install linker
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib
      - name: Test
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: make test
  wasm-check:
    name: WASM Check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-unknown-unknown
            os: ubuntu-latest
          - target: wasm32-unknown-emscripten
            os: ubuntu-latest
          - target: wasm32-unknown-emscripten
            os: windows-latest
          - target: wasm32-unknown-emscripten
            os: macos-latest
    runs-on: ubuntu-latest
    steps:
      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: make check
  wasi:
    name: WASI
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-wasip1]
    runs-on: ubuntu-latest
    steps:
      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install WasmTime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash
          curl -LO https://github.com/bytecodealliance/wasmtime/releases/download/v4.0.0/wasmtime-v4.0.0-x86_64-linux.tar.xz
          tar xvf wasmtime-v4.0.0-x86_64-linux.tar.xz
          echo `pwd`/wasmtime-v4.0.0-x86_64-linux >> $GITHUB_PATH
      - name: Test
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: make test
  nightly:
    name: Nightly Tests
    runs-on: ubuntu-latest
    steps:
      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test
        run: make test
